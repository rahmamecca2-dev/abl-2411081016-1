spring.application.name=order
server.port=8082

# Eureka dinonaktifkan (tanpa eureka)
eureka.client.enabled=false
eureka.client.register-with-eureka=false
eureka.client.fetch-registry=false

# URL Service Produk dan Pelanggan (akses langsung via HTTP REST)
service.produk.url=http://localhost:8080/api/produk
service.pelanggan.url=http://localhost:8081/api/pelanggan

# Konfigurasi Database H2 (in-memory)
spring.datasource.url=jdbc:h2:mem:orderdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true